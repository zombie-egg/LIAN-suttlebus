apiVersion: v1
kind: Namespace
metadata:
  name: lian-suttlebus
---
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: lian-suttlebus
spec:
  ports:
    - name: http
      port: 3100
      targetPort: 3100
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: website-node
  namespace: lian-suttlebus
  labels:
    kubernetes.io/service-name: website
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 3100
endpoints:
  - addresses: ["__NODE_CNI_IP__"]
    conditions:
      ready: true
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: lian-acme
  namespace: lian-suttlebus
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: lian-acme-account
    solvers:
      - http01:
          ingress:
            name: website
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website
  namespace: lian-suttlebus
  annotations:
    cert-manager.io/issuer: lian-acme
spec:
  tls:
    - hosts: ["__SITE_HOST__"]
      secretName: website-tls
  rules:
    - host: "__SITE_HOST__"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website
                port:
                  number: 3100
